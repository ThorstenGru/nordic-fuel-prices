name: EuroFuelPrices — Scrape

# GitHub's `schedule:` trigger is best-effort: measured over 100 runs the median gap between
# "every 30 min" runs was 262 minutes (max 9 h). So the cron below is only a SAFETY NET; the
# real cadence comes from the `chain` job, which re-dispatches this workflow ~12 min after each
# run finishes (workflow_dispatch triggered with GITHUB_TOKEN is allowed to start new runs).
# Per-source cadences (REFRESH_MINUTES in each scraper) keep upstream APIs from being hammered:
# a source that was refreshed recently is re-published from the previous run instead.

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Refresh every source now (ignore per-source cadence)"
        type: boolean
        default: false
      allow_shrink:
        description: "Country codes (comma-separated) allowed to shrink past the regression guards, one run only"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: pages-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyflakes

      - name: Unit tests (a failing test blocks the scrape and deploy)
        working-directory: src
        run: python -m unittest discover -s tests

      - name: Frontend tests and page syntax (a broken index.html must not be republished every 15 minutes)
        run: |
          node tools/check_page_syntax.js
          node tools/check_data_versions.js
          for f in tools/test_*.js; do node "$f" || exit 1; done
          node tools/check_fares.js && node tools/check_ac_tariffs.js

      - name: Last published accuracy meter (data/de_accuracy.json; the German step adds this run's ANWB-vs-MTS-K differences to it)
        continue-on-error: true
        run: mkdir -p data && (curl -fsS --retry 3 --max-time 30 https://eurofuelprices.com/de_accuracy.json -o data/de_accuracy.json || rm -f data/de_accuracy.json)

      - name: Run scrapers
        env:
          TANKERKOENIG_API_KEY: ${{ secrets.TANKERKOENIG_API_KEY }}
          # repo variable: off (default) | test | commercial. See docs/TANKERKOENIG_SETUP.md
          TANKERKOENIG_MODE: ${{ vars.TANKERKOENIG_MODE || 'off' }}
          GOON_API_KEY: ${{ secrets.GOON_API_KEY }}
          # repo variable: peco (default) | official | both. 'official' needs the owner's permission first, see docs/ROMANIA_SETUP.md
          ROMANIA_SOURCE: ${{ vars.ROMANIA_SOURCE || 'peco' }}
          FORCE_REFRESH: ${{ inputs.force && '1' || '0' }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink }}
        run: python src/main.py

      - name: Electricity prices (data/elpris.json; never fails the run, keeps last good file)
        continue-on-error: true
        run: python src/elpris.py

      - name: Keep last good elpris.json if this run produced none
        continue-on-error: true
        run: test -f data/elpris.json || curl -fsS --retry 3 --max-time 30 https://eurofuelprices.com/elpris.json -o data/elpris.json || rm -f data/elpris.json

      - name: Price cycles (data/price_cycles.json; never fails the run, folds into the last published file)
        continue-on-error: true
        run: python src/price_cycles.py

      - name: Keep last good price_cycles.json if this run produced none
        continue-on-error: true
        run: test -f data/price_cycles.json || curl -fsS --retry 3 --max-time 30 https://eurofuelprices.com/price_cycles.json -o data/price_cycles.json || rm -f data/price_cycles.json

      - name: Charging stations (data/ev_*.json; calls Open Charge Map/NOBIL only when the published file is older than 6 days; never fails the run)
        continue-on-error: true
        timeout-minutes: 10
        env:
          OCM_API_KEY: ${{ secrets.OCM_API_KEY }}
          # optional: SE/NO merge; skipped silently when the secret does not exist. See docs/CHARGERS_PIPELINE.md
          NOBIL_API_KEY: ${{ secrets.NOBIL_API_KEY }}
          FORCE_REFRESH: ${{ inputs.force && '1' || '0' }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink }}
        run: python src/chargers.py

      - name: Keep last good ev_*.json if this run produced none
        continue-on-error: true
        run: |
          for cc in se no dk de; do
            test -f data/ev_$cc.json || curl -fsS --retry 3 --max-time 30 https://eurofuelprices.com/ev_$cc.json -o data/ev_$cc.json || rm -f data/ev_$cc.json
          done

      - name: Copy web files to data dir
        run: cp -r web/* data/

      - name: Build SEO town pages (SE, AT, FR, ES, PT, DK live; DE/CH gated until a licensed source) + sitemaps
        run: python src/seo_pages.py

      - name: Build Europe price index, border-comparison pages and open data (never fails the deploy)
        continue-on-error: true
        run: python src/europe_index.py

      - name: IndexNow ping (once a day, free; never fails the deploy)
        continue-on-error: true
        run: python src/indexnow.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./data
          publish_branch: gh-pages
          # Single-commit history: the data changes every ~15 min and ~60 MB per publish would
          # otherwise bloat the repository by gigabytes per day.
          force_orphan: true
          commit_message: "data ${{ github.run_id }}"

  chain:
    # Keeps the cadence close to 15 minutes regardless of GitHub's cron delays.
    needs: scrape
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait, then dispatch the next run (unless one is already queued/running)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          sleep 690
          others=$(gh run list --repo "$REPO" --workflow scrape.yml --json databaseId,status \
            --jq "[.[] | select((.status==\"queued\" or .status==\"in_progress\" or .status==\"waiting\") and .databaseId != $THIS_RUN)] | length")
          echo "other active/queued scrape runs: $others"
          if [ "$others" -eq 0 ]; then
            gh workflow run scrape.yml --repo "$REPO" --ref main
          else
            echo "another run is already active — not dispatching (prevents duplicate chains)"
          fi
