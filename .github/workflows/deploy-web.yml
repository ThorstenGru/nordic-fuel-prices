name: EuroFuelPrices — Deploy Web

# Runs on every push to main that touches web/ files.
# This way frontend changes (index.html) go live immediately
# without waiting for the next scrape (which also re-publishes web/ every ~15 min).

on:
  push:
    branches: [main]
    paths:
      - 'web/**'

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Checkout gh-pages into subdirectory
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          ref: gh-pages
          path: gh-pages-dir
          fetch-depth: 1

      - name: Overwrite web files on gh-pages (retry if the scraper force-pushed meanwhile)
        run: |
          git -C gh-pages-dir config user.name  "github-actions[bot]"
          git -C gh-pages-dir config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git -C gh-pages-dir fetch --depth 1 origin gh-pages
            git -C gh-pages-dir reset --hard origin/gh-pages
            rsync -a --delete --exclude='.git' --exclude='se/' --exclude='at/' --exclude='de/' --exclude='ch/' --exclude='fr/' --exclude='sitemap-*.xml' web/. gh-pages-dir/
            git -C gh-pages-dir add -A
            git -C gh-pages-dir diff-index --quiet HEAD || git -C gh-pages-dir commit -m "Deploy web files from main [skip ci]"
            if git -C gh-pages-dir push origin HEAD:gh-pages; then exit 0; fi
            echo "push rejected (attempt $i) — retrying"
            sleep 6
          done
          exit 1
