name: Facebook — weekly numbers (Euro Fuel Prices Page)

# Followers, reactions, comments and shares of the Page's recent posts, into docs/facebook/insights_weekly.csv and insights_posts.csv (tools/fb_insights.py).
# Needs the same secrets; without them nothing happens. Reads only counts, nothing about people.

on:
  schedule:
    - cron: '30 6 * * 1'    # Monday 06:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: facebook-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.3.0
        with:
          python-version: "3.11"

      - name: Read the Page numbers
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python tools/fb_insights.py

      - name: Commit the numbers
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/facebook/insights_weekly.csv 2>/dev/null || true
          git add docs/facebook/insights_posts.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Facebook numbers [skip ci]"
            ok=0
            for i in 1 2 3; do if git pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi; sleep 5; done
            if [ "$ok" != 1 ]; then echo "::error::the numbers could not be saved"; exit 1; fi
          fi
