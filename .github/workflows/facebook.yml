name: Facebook — daily post and replies (Euro Fuel Prices Page)

# Runs on GitHub, so it needs no computer, app or person. Everything is posted by the Page itself with a Page access token
# (secrets FB_PAGE_ID and FB_PAGE_TOKEN). Without the secrets the job exits quietly. Setup: docs/facebook/GRAPH_API_SETUP.md

on:
  schedule:
    - cron: '0 16 * * *'    # daily post (17:00/18:00 in Sweden and Germany: after work; moved from 07:00 on 2026-11-16)
    - cron: '30 17 * * *'   # retry of the daily post if the first run had to skip (a post is never made twice: the log is checked)
    - cron: '30 * * * *'    # answers to "comment your town" comments
  workflow_dispatch:
    inputs:
      mode:
        description: 'post or replies'
        default: 'post'
      dry_run:
        description: 'dry run (no posting)'
        type: boolean
        default: true
      post_format:
        description: 'one-off format for mode post (ranking, border-pair, quiz, feature, spotlight, local-ask); empty = today''s plan'
        default: ''
      nolink:
        description: 'never print the link in the post'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: facebook-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.11"

      - name: Run the Facebook routine
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '30 * * * *' && 'replies' || 'post') }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
          FMT: ${{ github.event_name == 'workflow_dispatch' && inputs.post_format || '' }}
          NOLINK: ${{ github.event_name == 'workflow_dispatch' && inputs.nolink && '--nolink' || '' }}
        run: python tools/fb_bot.py "$MODE" $DRY ${FMT:+--format "$FMT"} $NOLINK

      - name: Commit the logs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # one path per call: git refuses the WHOLE add when one path (replied.csv before the first reply) does not exist, and the log row was then never saved
          git add docs/facebook/post_log.csv 2>/dev/null || true
          git add docs/facebook/replied.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Facebook log [skip ci]"
            ok=0
            for i in 1 2 3; do if git pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi; sleep 5; done
            if [ "$ok" != 1 ]; then echo "::error::the log row could not be saved - the next run may post again"; exit 1; fi
          fi
