name: Facebook — weekly video (Euro Fuel Prices Page)

# One generated 9:16 video a week, posted by the Page itself (same secrets as facebook.yml). Without the secrets it only renders.
# Dry run (the default for manual runs) renders the video and attaches it to the run as an artifact; nothing is posted.

on:
  schedule:
    - cron: '0 16 * * 0'    # Sunday 16:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry run (render only, no posting)'
        type: boolean
        default: true
      replace_video_id:
        description: 'Facebook video id to delete after the new one is posted (leave empty normally)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: facebook-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.11"

      - name: Install Pillow and ffmpeg
        run: |
          pip install "Pillow>=10.1,<13"
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core)

      - name: Render and post the weekly video
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
          REPLACE_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_video_id || '' }}
        run: python tools/fb_weekly.py $DRY ${REPLACE_ID:+--replace-id "$REPLACE_ID"} --out weekly_out

      - name: Keep the video of this run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-video
          path: |
            weekly_out/*.mp4
            weekly_out/f*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit the log
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/facebook/post_log.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Facebook log [skip ci]"
            ok=0
            for i in 1 2 3; do if git pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi; sleep 5; done
            if [ "$ok" != 1 ]; then echo "::error::the log row could not be saved - the next run may post again"; exit 1; fi
          fi
