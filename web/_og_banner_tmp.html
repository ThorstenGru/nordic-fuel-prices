<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; font-family:system-ui,-apple-system,'Segoe UI',sans-serif; }
  body { background:#F4F5F7; position:relative; }
  .accent-bar { position:absolute; top:0; left:0; right:0; height:14px; background:linear-gradient(90deg,#E8542F 0%,#E8542F 33%,#0F766E 33%,#0F766E 66%,#FFC934 66%,#FFC934 100%); }
  .wrap { padding:70px 90px 0; }
  .logo { display:flex; align-items:center; gap:16px; margin-bottom:38px; }
  .pump { width:64px; height:64px; border-radius:18px; background:#E8542F; display:flex; align-items:center; justify-content:center; font-size:34px; }
  .word { font-size:34px; font-weight:700; color:#16181D; letter-spacing:-0.5px; }
  .word span { color:#16A34A; }
  h1 { font-size:48px; font-weight:700; color:#16181D; line-height:1.2; max-width:1020px; letter-spacing:-1px; }
  .sub { font-size:24px; color:#6B7280; margin-top:20px; max-width:880px; line-height:1.4; }
  .chips { display:flex; gap:14px; margin-top:38px; }
  .chip { background:#FFFFFF; border:1px solid #E6E8EB; border-radius:999px; padding:14px 26px; font-size:22px; font-weight:500; color:#16181D; display:flex; align-items:center; gap:10px; }
  .dot { width:14px; height:14px; border-radius:50%; }
  .d-green { background:#16A34A; } .d-blue { background:#2563EB; } .d-amber { background:#F59E0B; } .d-coral { background:#E8542F; }
  .url { position:absolute; bottom:48px; left:90px; font-size:24px; font-weight:500; color:#0F766E; }
</style>
</head>
<body>
  <div class="accent-bar"></div>
  <div class="wrap">
    <div class="logo">
      <div class="pump">⛽</div>
      <div class="word">Euro<span>Fuel</span>Prices</div>
    </div>
    <h1>Live fuel prices across Europe —<br>graded by how much you can trust them</h1>
    <div class="sub">42 countries. Real government feeds where they exist, honestly labelled everywhere else.</div>
    <div class="chips">
      <div class="chip"><span class="dot d-green"></span>Official, real-time</div>
      <div class="chip"><span class="dot d-blue"></span>Official, periodic</div>
      <div class="chip"><span class="dot d-amber"></span>Third-party</div>
      <div class="chip"><span class="dot d-coral"></span>Community</div>
    </div>
  </div>
  <div class="url">eurofuelprices.com</div>
</body>
</html>
